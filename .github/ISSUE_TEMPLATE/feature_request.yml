name: Feature request
description: Propose a focused improvement
title: "feature: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What concrete problem or limitation should be addressed?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the smallest useful solution and its public API, if applicable.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe current workarounds or other designs you considered.
